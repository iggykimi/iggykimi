<svg width="1280" height="240" viewBox="0 0 1280 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data science · AI engineering · LLM systems">
  <defs>
    <linearGradient id="skyP4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121417"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <linearGradient id="waveA4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8a70"/>
      <stop offset=".5" stop-color="#22d3a7"/>
      <stop offset="1" stop-color="#5b5bd6"/>
    </linearGradient>
    <linearGradient id="waveB4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14523f"/>
      <stop offset=".55" stop-color="#1a6e85"/>
      <stop offset="1" stop-color="#3d3a8f"/>
    </linearGradient>
    <linearGradient id="tagGrad4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ef0cd"/>
      <stop offset="1" stop-color="#9d8bff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="240" fill="url(#skyP4)"/>

  <!-- node graph, left -->
  <g stroke="#2e3a3a" stroke-width="1.2" opacity=".8">
    <line x1="90" y1="70" x2="150" y2="110"/><line x1="150" y1="110" x2="110" y2="160"/>
    <line x1="150" y1="110" x2="210" y2="80"/><line x1="210" y1="80" x2="250" y2="130"/>
    <line x1="150" y1="110" x2="200" y2="170"/>
  </g>
  <g fill="#3ddbb0">
    <circle cx="90" cy="70" r="4" opacity=".55"/><circle cx="210" cy="80" r="4" opacity=".55"/>
    <circle cx="250" cy="130" r="3.5" opacity=".45"/><circle cx="200" cy="170" r="3.5" opacity=".45"/>
  </g>
  <circle cx="150" cy="110" r="6" fill="#22d3a7" opacity=".8"/>

  <!-- node graph, right -->
  <g stroke="#34304e" stroke-width="1.2" opacity=".8">
    <line x1="1120" y1="80" x2="1180" y2="120"/><line x1="1180" y1="120" x2="1130" y2="165"/>
    <line x1="1180" y1="120" x2="1230" y2="90"/><line x1="1130" y1="165" x2="1190" y2="185"/>
  </g>
  <g fill="#8f86e8">
    <circle cx="1120" cy="80" r="4" opacity=".55"/><circle cx="1230" cy="90" r="4" opacity=".55"/>
    <circle cx="1190" cy="185" r="3.5" opacity=".45"/><circle cx="1130" cy="165" r="3.5" opacity=".45"/>
  </g>
  <circle cx="1180" cy="120" r="6" fill="#9d8bff" opacity=".8"/>

  <!-- tagline -->
  <text x="640" y="118" text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="6" fill="url(#tagGrad4)">DATA SCIENCE · AI ENGINEERING · LLM SYSTEMS</text>

  <!-- waves -->
  <path d="M0,168 C200,146 380,182 560,170 C760,156 940,128 1120,142 C1200,148 1250,158 1280,155 L1280,240 L0,240 Z"
        fill="url(#waveB4)" opacity=".5"/>
  <path d="M0,192 C170,176 340,200 520,190 C720,178 900,154 1080,166 C1170,172 1240,182 1280,180 L1280,240 L0,240 Z"
        fill="url(#waveA4)" opacity=".88"/>
